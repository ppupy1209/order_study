services:
  db:
    image: postgres:16-alpine
    container_name: order-study-db
    environment:
      POSTGRES_DB: order_study
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order_study"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: order-study-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/order_study
      SPRING_DATASOURCE_USERNAME: order
      SPRING_DATASOURCE_PASSWORD: order
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
